<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post-Wedding Dinner Invitation | Wasim Raza & Zebun Nisa</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (for JSX parsing in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts for Urdu Calligraphy & English Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    .font-urdu {
      font-family: 'Gulzar', 'Noto Nastaliq Urdu', serif;
    }
    .font-serif-custom {
      font-family: 'Playfair Display', serif;
    }
    .bg-royal-pattern {
      background-color: #0b1329;
      background-image: radial-gradient(circle at 50% 50%, #1a2a4a 0%, #080d1a 100%);
    }
  </style>
</head>
<body class="bg-royal-pattern text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [isOpen, setIsOpen] = useState(false);
      const [lang, setLang] = useState('ur');

      const handleWhatsAppRSVP = () => {
        const message = encodeURIComponent(
          lang === 'ur'
            ? "السلام علیکم! دعوت نامہ ملا، بہت شکریہ۔ انشاء اللہ ہم جلد مبارکباد دینے اور طعام میں شرکت کی تاریخ طے کرنے کے لیے آپ سے رابطہ کریں گے۔"
            : "Greetings! Thank you so much for the dinner invitation. We will reach out soon to convey our congratulations and coordinate a convenient time."
        );
        window.open(`https://wa.me/?text=${message}`, '_blank');
      };

      return (
        <div className="w-full max-w-2xl mx-auto my-8">
          {/* Header Controls */}
          <div className="flex justify-between items-center mb-6 px-2">
            <button 
              onClick={() => setLang(lang === 'ur' ? 'en' : 'ur')}
              className="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-4 py-2 rounded-full text-sm transition-all"
            >
              {lang === 'ur' ? 'English Version' : 'اردو میں دیکھیں'}
            </button>
            <div className="text-amber-400 text-xs tracking-widest uppercase font-semibold">
              Digital Post-Wedding Invitation
            </div>
          </div>

          {!isOpen ? (
            /* Envelope State */
            <div 
              onClick={() => setIsOpen(true)}
              className="cursor-pointer bg-gradient-to-br from-amber-900/40 via-slate-900 to-amber-950/60 border-2 border-amber-500/50 rounded-2xl p-10 text-center shadow-2xl hover:border-amber-400 transition-all transform hover:-translate-y-1 relative overflow-hidden"
            >
              <div className="absolute inset-0 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px] opacity-10"></div>
              
              <div className="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-300 flex items-center justify-center shadow-lg border-2 border-amber-200">
                <span className="text-slate-950 font-bold text-2xl font-serif-custom">W & Z</span>
              </div>

              <h2 className={`text-2xl md:text-3xl font-bold text-amber-200 mb-2 ${lang === 'ur' ? 'font-urdu' : 'font-serif-custom'}`}>
                {lang === 'ur' ? 'دعوتِ طعام' : 'Invitation for Dinner'}
              </h2>
              
              <p className="text-amber-400/80 text-sm mb-6">
                {lang === 'ur' ? 'کارڈ کھولنے کے لیے کلک کریں' : 'Click to Open Invitation'}
              </p>

              <div className="inline-block bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold px-6 py-2 rounded-full shadow-md text-sm">
                Open Card ✨
              </div>
            </div>
          ) : (
            /* Open Card State */
            <div className="bg-slate-900/90 border-2 border-amber-500/60 rounded-2xl p-8 md:p-12 shadow-2xl relative overflow-hidden backdrop-blur-md transition-all">
              {/* Corner Ornaments */}
              <div className="absolute top-3 left-3 text-amber-500/40 text-xl">✦</div>
              <div className="absolute top-3 right-3 text-amber-500/40 text-xl">✦</div>
              <div className="absolute bottom-3 left-3 text-amber-500/40 text-xl">✦</div>
              <div className="absolute bottom-3 right-3 text-amber-500/40 text-xl">✦</div>

              {lang === 'ur' ? (
                /* URDU CONTENT WITH NASTALIQ FONTS */
                <div className="text-center font-urdu leading-loose">
                  <div className="text-amber-400 text-xl mb-4">﷽</div>
                  
                  <h1 className="text-2xl text-amber-300 mb-2">دعوتِ طعام</h1>
                  
                  <div className="my-6 py-4 border-y border-amber-500/30">
                    <div className="text-4xl md:text-5xl text-amber-200 font-bold mb-2">
                      وسیم رضا اور زیب النساء
                    </div>
                    <div className="text-lg text-amber-400/90">
                      (بمع اہل و عیال)
                    </div>
                  </div>

                  <p className="text-slate-200 text-lg md:text-xl my-6 max-w-lg mx-auto">
                    السلام علیکم ورحمۃ اللہ وبرکاتہ<br/>
                    ہم آپ کو وسیم رضا اور زیب النساء کی شادی کے بعد، اپنی خوشیوں میں شریک کرنے کے لیے ایک پرُتکلف عشائیہ (Post-Wedding Dinner) میں شرکت کی صمیمِ قلب سے دعوت دیتے ہیں۔
                  </p>

                  <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 my-6 text-amber-300 text-base md:text-lg">
                    آپ کے لیے جو بھی وقت اور تاریخ مناسب ہو، ہمیں مطلع فرمائیں، تاکہ ہم مل کر یہ خوشی کا لمحہ یادگار بنا سکیں۔ آپ کی تشریف آوری ہمارے لیے باعثِ افتخار ہوگی۔
                  </div>
                </div>
              ) : (
                /* ENGLISH CONTENT */
                <div className="text-center font-serif-custom">
                  <div className="text-amber-400 text-sm tracking-widest uppercase mb-4">In the Name of Allah</div>
                  
                  <h1 className="text-3xl text-amber-300 mb-2 font-bold">Invitation for Dinner</h1>
                  
                  <div className="my-6 py-4 border-y border-amber-500/30">
                    <div className="text-3xl md:text-4xl text-amber-200 font-bold mb-1">
                      Wasim Raza & Zebun Nisa
                    </div>
                    <div className="text-base text-amber-400/90 italic">
                      (with family)
                    </div>
                  </div>

                  <p className="text-slate-200 text-base md:text-lg my-6 max-w-lg mx-auto leading-relaxed">
                    Greetings with Peace, Mercy, and Blessings of Allah.<br/>
                    We cordially invite you to a formal Post-Wedding Dinner to join us in celebrating the joyful marriage of Wasim Raza and Zebun Nisa.
                  </p>

                  <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 my-6 text-amber-300 text-sm md:text-base">
                    Please inform us of any date and time that is convenient for you, so that we can make this joyful moment memorable together. Your honorable presence will be a matter of pride for us.
                  </div>
                </div>
              )}

              {/* Action Buttons */}
              <div className="mt-8 flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button 
                  onClick={handleWhatsAppRSVP}
                  className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm"
                >
                  <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                  </svg>
                  {lang === 'ur' ? 'واتس ایپ پر مطلع کریں' : 'Respond via WhatsApp'}
                </button>

                <button 
                  onClick={() => setIsOpen(false)}
                  className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-amber-300/80 border border-amber-500/30 font-semibold px-6 py-3 rounded-xl transition-all text-sm"
                >
                  {lang === 'ur' ? 'بند کریں' : 'Close Card'}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
